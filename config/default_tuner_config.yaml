online_causal_tuner:
  ros__parameters:
    model_path: "models/causal_tuner_models.pkl"

    # DR-optimal policy tree. "bounded_argmax" is the mu-hat-greedy ablation:
    # V_DR 2.376 vs 2.909, and 145 ms/tick vs 0.05 ms/tick.
    selection_mode: "enumerate"

    # MUST equal artifact["objective_weights"] = {risk_lambda: 10.0,
    # stall_mu: 2.0, payload_omega: 0.5}, or the tree optimizes a different
    # objective than the node scores. The node refuses to load on mismatch.
    risk_penalty_lambda: 10.0
    stall_penalty_mu: 2.0
    payload_value_omega: 0.8333333333333334
    risk_threshold_p_max: 0.20

    # hysteresis, as a fraction of the progress ceiling
    utility_deadband_frac: 0.045
    arm_switch_cost_frac: 0.055

    # A(R) constants are estimated by analysis/calibrate_envelope.py.
    # The values below are NOT used unless envelope_constants_path is empty.
    envelope_constants_path: "models/envelope_constants.json"

    # fallbacks only, and a warning is logged if they are used
    # Arm-extension (carry) clearance gates, tuned for the Mirte lab where the
    # max clearance anywhere in the navigable region is ~0.91 m. The TIAGo
    # default of 1.20 m made carry unreachable, so the arm never switched.
    # adopt > retain provides hysteresis against chattering.
    carry_adopt_r_min: 0.65
    carry_retain_r_min: 0.50
    # Every demo run starts with the arm in the carry pose and a matching
    # footprint, and only adapts once it has a goal and can observe risk.
    # Without this the envelope tucks the arm on the first tick, before a
    # goal exists, because tucked allows a higher speed and speed dominates
    # the envelope-only selection key.
    startup_carry_hold: true

    clearance_margin_m: 0.10
    decel_limit_mps2: 0.55
    inflation_floor_m: 0.325
    envelope_hysteresis_m: 0.15
    lateral_tracking_tau_s: 0.35     # NOT calibrated, see limitations

    tuning_rate_hz: 5.0
    anticipation_delta_s: 4.0
    dry_run: false
    # DEMO (Mirte): run the physics feasibility envelope only, WITHOUT the causal
    # model (the Tiago artifact is not valid for the Mirte config space, and
    # retraining is out of scope for the demo). The tuner still switches
    # arm/footprint, speed and inflation from the live risk state, just via the
    # geometric/kinematic envelope A(R) instead of learned effects.
    envelope_only: true
